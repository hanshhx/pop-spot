plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.1.0"
    id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
    // 크로스플랫폼 line ending 일관성 — Windows/macOS/Linux 어디서 빌드해도 LF 로 강제.
    // 기본값(GIT_ATTRIBUTES → OS 네이티브)은 Windows 에서 CRLF 를 원해서 LF 로 커밋된 .java 파일
    // 120 개가 spotlessCheck 에 걸렸다. .gitattributes 의 'text eol=lf' 와 짝.
    lineEndings = 'UNIX'

    java {
        target 'src/**/*.java'
        googleJavaFormat('1.17.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}


/*
 * Spring Boot BOM 이 관리하는 버전 중 취약점이 남은 것만 손으로 올린다.
 *
 * <p>2026-09-04 Dependabot 경보를 켜면서 백엔드에 critical 4 · high 4 가 드러났다. 그 전까지
 * 의존성 검사가 2026-08-02 부터 죽어 있었다(security-scan.yml, 로컬 H2 손상). Tomcat 3건은
 * 8월 26일 공개라 정확히 그 공백 동안 들어온 것이다.
 *
 * <p>부트를 4.0.7 → 4.0.8 로 올려 postgresql · jackson(2·3) · netty · log4j2 는 해결했다.
 * 아래 셋은 4.0.8 도 아직 취약한 버전을 물고 있어 따로 올린다. 부트가 이 버전들을 따라잡으면
 * 이 블록은 지운다.
 *
 * <p>⚠️ 속성 이름이 틀리면 <b>오류 없이 조용히 무시된다.</b> 그래서 배포 전에 만들어진 jar 의
 * BOOT-INF/lib 에서 실제 버전을 확인할 것.
 */
ext['tomcat.version'] = '11.0.25'      // CVE-2026-68525 / 65905 / 65182 (critical)
ext['httpcore5.version'] = '5.4.3'     // HPackDecoder / HTTP1 헤더 파싱 (high)
ext['httpclient5.version'] = '5.6.3'   // httpcore5 5.4.x 와 짝

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'popspot-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    // 2. JSON 처리 라이브러리 (ObjectMapper, JsonNode 사용 시 필수)
    // 스프링 부트 웹 스타터에 기본 포함되어 있지만, 에러가 난다면 명시적으로 추가해야 합니다.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
// [1] LangChain4j 스프링 부트 통합팩
    //
    // opennlp 를 뺀다. langchain4j 는 문서 분할기(DocumentSplitter)용으로 opennlp-tools 를
    // 끌어오는데, 우리는 채팅 모델(OpenAiChatModel · ChatLanguageModel)만 쓰고 분할기는 쓰지
    // 않는다. 그런데도 jar 에 opennlp-tools-1.9.4 가 실려 critical 2건(CVE-2026-42027 임의 클래스
    // 인스턴스화 · CVE-2026-40682 XXE)과 high 1건을 달고 있었다.
    //
    // 2.5.9 로 올리는 방법도 있으나 1.x → 2.x 는 메이저 점프라 langchain4j 0.36.0 이 컴파일한
    // API 와 어긋날 수 있다. 안 쓰는 것을 빼는 쪽이 위험이 없고 jar 도 가벼워진다.
    implementation('dev.langchain4j:langchain4j-spring-boot-starter:0.36.0') {
        exclude group: 'org.apache.opennlp'
    }
    // Groq 는 OpenAI API 호환이므로 langchain4j-open-ai 사용
    implementation('dev.langchain4j:langchain4j-open-ai:0.36.0') {
        exclude group: 'org.apache.opennlp'
    }
    implementation 'org.json:json:20231013'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.algolia:algoliasearch-apache:3.16.1'
    implementation 'org.postgresql:postgresql'
    // 🔥 [임의 추가] 실제 JWT 토큰 발급 및 검증을 위한 jjwt 라이브러리 추가
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.sentry:sentry-spring-boot-starter:8.33.0'

    // 🔥 [추가] Rate Limiting (브루트포스/이메일 폭탄 방어)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // v2.19 — API 응답 캐싱 (자주 호출되는 GET 5분 캐싱). in-memory Caffeine.
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // 🔥 [추가] Flyway (운영에서 ddl-auto=validate 와 함께 마이그레이션 관리)
    //
    // starter 가 <b>반드시</b> 있어야 한다. Spring Boot 4 부터 자동설정이 통합 모듈별로 쪼개져서,
    // flyway-core 만 넣으면 라이브러리는 클래스패스에 있는데 아무도 그것을 켜 주지 않는다 —
    // spring-boot-autoconfigure 에 더 이상 FlywayAutoConfiguration 이 들어 있지 않기 때문이다.
    //
    // 실제로 이 줄이 없어서 운영에서 Flyway 가 <b>단 한 번도 돌지 않았다.</b> 설정 파일에
    // spring.flyway.enabled=true 가 있었는데도 기동 로그에 Flyway 한 줄이 안 찍혔고,
    // flyway_schema_history 테이블도 만들어지지 않았다. 스키마는 그동안 ddl-auto 와 손으로
    // 넣은 SQL 로만 맞춰져 왔고, 2026-08-03 에 컬럼 하나가 누락돼 로그인이 끊겼다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
sentry {
    includeSourceContext = false
    org = "kimdonghyun-oz"
    projectName = "java-spring-boot"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}
