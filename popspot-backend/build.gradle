plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.1.0"
    id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
    // 크로스플랫폼 line ending 일관성 — Windows/macOS/Linux 어디서 빌드해도 LF 로 강제.
    // 기본값(GIT_ATTRIBUTES → OS 네이티브)은 Windows 에서 CRLF 를 원해서 LF 로 커밋된 .java 파일
    // 120 개가 spotlessCheck 에 걸렸다. .gitattributes 의 'text eol=lf' 와 짝.
    lineEndings = 'UNIX'

    java {
        target 'src/**/*.java'
        googleJavaFormat('1.17.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'popspot-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    // 2. JSON 처리 라이브러리 (ObjectMapper, JsonNode 사용 시 필수)
    // 스프링 부트 웹 스타터에 기본 포함되어 있지만, 에러가 난다면 명시적으로 추가해야 합니다.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
// [1] LangChain4j 스프링 부트 통합팩
    implementation 'dev.langchain4j:langchain4j-spring-boot-starter:0.36.0'
    // Groq 는 OpenAI API 호환이므로 langchain4j-open-ai 사용
    implementation 'dev.langchain4j:langchain4j-open-ai:0.36.0'
    implementation 'org.json:json:20231013'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.algolia:algoliasearch-apache:3.16.1'
    implementation 'org.postgresql:postgresql'
    // 🔥 [임의 추가] 실제 JWT 토큰 발급 및 검증을 위한 jjwt 라이브러리 추가
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.sentry:sentry-spring-boot-starter:8.33.0'

    // 🔥 [추가] Rate Limiting (브루트포스/이메일 폭탄 방어)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // v2.19 — API 응답 캐싱 (자주 호출되는 GET 5분 캐싱). in-memory Caffeine.
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // 🔥 [추가] Flyway (운영에서 ddl-auto=validate 와 함께 마이그레이션 관리)
    //
    // starter 가 <b>반드시</b> 있어야 한다. Spring Boot 4 부터 자동설정이 통합 모듈별로 쪼개져서,
    // flyway-core 만 넣으면 라이브러리는 클래스패스에 있는데 아무도 그것을 켜 주지 않는다 —
    // spring-boot-autoconfigure 에 더 이상 FlywayAutoConfiguration 이 들어 있지 않기 때문이다.
    //
    // 실제로 이 줄이 없어서 운영에서 Flyway 가 <b>단 한 번도 돌지 않았다.</b> 설정 파일에
    // spring.flyway.enabled=true 가 있었는데도 기동 로그에 Flyway 한 줄이 안 찍혔고,
    // flyway_schema_history 테이블도 만들어지지 않았다. 스키마는 그동안 ddl-auto 와 손으로
    // 넣은 SQL 로만 맞춰져 왔고, 2026-08-03 에 컬럼 하나가 누락돼 로그인이 끊겼다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
sentry {
    includeSourceContext = false
    org = "kimdonghyun-oz"
    projectName = "java-spring-boot"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}
