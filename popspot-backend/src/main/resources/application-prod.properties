# ==========================================
# 운영(prod) 프로필 — application.properties 위에 덮어쓰기
# 실행 방법: SPRING_PROFILES_ACTIVE=prod  (systemd EnvironmentFile 또는 -Dspring.profiles.active=prod)
# ==========================================

# 운영에서는 절대 update / create 금지! 스키마 변경은 Flyway 가 담당.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway 활성화
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# 운영 DB는 V28까지 ddl-auto=update 와 수동 SQL 로 이미 적용된 기존 스키마이다. Flyway 는
# V29 부터 관리한다.
#
# 원래 22 였는데, Flyway 가 실제로 켜지는 순간 V23~V28 이 자동 실행된다는 점이 문제였다.
# 그중 V26 은 popup_image 의 중복 행을 <b>지우는</b> 문장을 포함하는데, 운영에는 팝업당 사진이
# 딱 한 장씩만 있어서 그대로 돌면 198개 팝업의 사진이 통째로 사라진다. 게다가 Flyway 는
# 마이그레이션이 실패하면 기동을 중단시키므로, 사람이 안 보는 사이 재시작 한 번에 서비스가
# 멈추거나 사진이 날아가는 두 가지 사고가 모두 가능했다.
#
# 남은 빚: V26 의 uk_popup_image_pexels_url(부분 유니크 인덱스)는 아직 없다. 중복 사진 198장을
# 새 사진으로 교체한 뒤에 별도 마이그레이션으로 넣는다. 지금은 pexels_photo_id 유니크 인덱스와
# 애플리케이션 단 URL 중복 검사가 새 중복을 막고 있다.
spring.flyway.baseline-version=28
spring.flyway.baseline-description=legacy-schema-through-v28

# 운영 백업은 명시적으로 false를 주지 않는 한 활성화한다.
popspot.backup.enabled=${POPSPOT_BACKUP_ENABLED:true}

# 운영 관리자 민감 작업은 비밀번호 또는 TOTP 재확인을 기본으로 요구한다.
# 비상 해제는 환경변수를 명시적으로 false로 설정한 경우에만 허용한다.
app.admin.reauth.enabled=${APP_ADMIN_REAUTH_ENABLED:true}

# 로그 레벨
logging.level.root=INFO
logging.level.com.example.popspotbackend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Actuator 외부에는 health 만
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Sentry
sentry.send-default-pii=false
sentry.traces-sample-rate=0.2

# DevTools 차단 (운영 환경 안전)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
