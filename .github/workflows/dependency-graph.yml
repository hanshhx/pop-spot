name: Dependency graph

# 로컬 취약점 DB의 반복 장애 이후 Gradle 의존성을 GitHub에 제출하는 방식으로 전환했다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 의존성 제출에 필요한 쓰기 권한을 이 작업에만 둔다.
# 저장소의 Dependency graph와 Dependabot alerts 설정도 활성화돼 있어야 한다.
permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: popspot-backend
