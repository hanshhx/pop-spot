name: Security scan

# 의존성 취약점 검사 — 주 1회.
#
# 원래는 quality.yml 에서 커밋마다 돌렸는데 두 가지가 문제였다.
#
#   1. 한 번에 30~50분. 미국 취약점 DB(NVD) 전체를 내려받기 때문이다.
#      비공개 저장소로 바꾸면 Actions 무료 한도(월 2,000분)를 50번 push 로 다 쓴다.
#   2. 자주 실패한다. NVD 가 응답을 끊으면 그대로 빌드 실패다(실측 성공 29·30·56분 /
#      실패 3·4·7분). 코드는 멀쩡한데 빨간불만 켜져 있는 상태가 반복됐다.
#
# 검사 대상은 내 코드가 아니라 남이 만든 라이브러리다. 커밋한다고 그 목록이 바뀌지 않고,
# 새 취약점은 발표 시점에 생기지 커밋 시점에 생기지 않는다. 주 1회가 맞는 주기다.

on:
  schedule:
    # 매주 월요일 04:00 KST (일요일 19:00 UTC). 주중에 결과를 보고 대응할 수 있는 시각.
    - cron: '0 19 * * 0'
  # 필요할 때 손으로 돌릴 수 있게. 의존성을 올린 직후에 쓴다.
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popspot-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      # NVD 데이터를 회차 간에 재사용한다. 이게 없으면 매번 처음부터 받느라 느리고,
      # 받는 도중 끊기면 그대로 실패한다. 캐시가 있으면 바뀐 분량만 따라잡는다.
      #
      # 키에 주차를 넣어 일주일마다 새로 만든다 — 캐시가 영원히 굳으면 새 CVE 를 못 본다.
      - name: NVD 데이터 캐시
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - run: chmod +x gradlew

      - name: 의존성 취약점 검사
        run: ./gradlew dependencyCheckAnalyze --info
        env:
          # 없어도 돌아가지만 NVD 가 요청을 강하게 제한해 실패율이 크게 오른다.
          # 발급은 무료다 — https://nvd.nist.gov/developers/request-an-api-key
          # 받으면 저장소 Settings → Secrets → Actions 에 NVD_API_KEY 로 넣는다.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # 실패해도 보고서는 남긴다. 무엇이 걸렸는지 봐야 판단할 수 있다.
      - name: 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: popspot-backend/build/reports/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 30
