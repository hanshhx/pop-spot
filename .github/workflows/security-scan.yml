name: Security scan

# 의존성 검사는 주 1회 및 수동으로 실행한다.
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popspot-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4

      # 이전 검사 데이터를 재사용해 전체 DB 재다운로드를 줄인다.
      - name: NVD 데이터 캐시
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - run: chmod +x gradlew

      - name: 의존성 취약점 검사
        run: ./gradlew dependencyCheckAnalyze --info
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: popspot-backend/build/reports/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 30
