name: Quality

on:
  push:
    branches: [main]
  pull_request:
  # 기본 브랜치 밖에서도 필요한 검사를 직접 실행할 수 있다.
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popspot-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: popspot-frontend/package-lock.json
      - run: npm ci
      # 코드 검사 결과를 의존성 검사와 별도로 확인한다.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
        # 이 브랜치의 기존 예외이다. 취약점 검사 결과는 로그에서 별도로 확인한다.
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SOCKET_URL: http://localhost:8080
          ALLOW_EMPTY_SEO_BUILD: "true"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popspot-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew spotlessCheck test bootJar

      # 검사를 통과한 JAR를 배포에도 사용할 수 있도록 보관한다.
      - uses: actions/upload-artifact@v4
        with:
          name: popspot-backend-jar
          path: popspot-backend/build/libs/*.jar
          retention-days: 14
          if-no-files-found: error
