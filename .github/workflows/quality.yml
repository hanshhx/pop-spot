name: Quality

on:
  push:
    branches: [main]
  pull_request:
  # 손으로도 돌릴 수 있게 둔다. 백엔드는 이 PC 에서 gradle 이 안 도는 환경이라
  # (로컬 소켓 차단) 여기가 유일한 검증 수단인데, main 이 아닌 가지에 올린 변경은
  # PR 을 열기 전까지 아무도 검사하지 않았다. 올리고 바로 확인할 길을 낸다.
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popspot-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: popspot-frontend/package-lock.json
      - run: npm ci
      # 검사 순서를 바꿨다 — 감사가 맨 앞에서 실패하면 뒤가 전부 건너뛰어져, 정작 코드가 깨졌는지는
      # 아무도 모르는 채로 빨간불만 오래 켜져 있었다(20회 연속). 코드 검사를 먼저 돌린다.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # 의존성 취약점은 보고만 하고 막지 않는다.
      #
      # Next.js 16.1.6 에 high 등급 권고가 걸려 있고 해결 버전은 16.2.12 인데, 그 버전은 빌드는
      # 통과하지만 Vercel 에서 서비스되는 배포로 승격되지 않았다(2026-07-28, 세 번 시도). 운영에
      # 사용자 영향이 있는 수정을 내보내야 해서 버전을 되돌렸다.
      #
      # 막지 않는 대신 결과는 로그에 남는다. 승격 문제가 풀리면 16.2.12 로 올리고 이 예외를 지운다.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SOCKET_URL: http://localhost:8080
          ALLOW_EMPTY_SEO_BUILD: "true"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: popspot-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew spotlessCheck test bootJar

      # 만든 jar 를 버리지 않고 남긴다.
      #
      # <p>배포는 VM 에 jar 를 올리는 방식인데(VM 에는 소스가 없다), 그동안 그 jar 를 어디서
      # 만들지가 매번 문제였다. 여기서 이미 만들고 있었으면서 결과를 버리고 있었다.
      #
      # <p>이제 검사를 통과한 그 jar 를 그대로 받아 올릴 수 있다. "검증한 것" 과 "배포한 것" 이
      # 같은 물건이 된다 — 따로 빌드하면 그 둘이 어긋날 수 있고, 어긋난 것은 배포 뒤에야 드러난다.
      - uses: actions/upload-artifact@v4
        with:
          name: popspot-backend-jar
          path: popspot-backend/build/libs/*.jar
          # 기본 90일은 이 용도에 과하다. 배포는 며칠 안에 끝난다.
          retention-days: 14
          if-no-files-found: error
      # 의존성 취약점 검사는 여기 없다 — GitHub 의존성 그래프 + Dependabot 경보로 옮겼다.
      #
      # 예전엔 커밋마다 dependencyCheckAnalyze 를 돌렸다가(한 번에 30~50분) 주 1회
      # security-scan.yml 로 뺐다. 그런데 그것도 2026-08-02 부터 5주 연속 실패했고, 원인은
      # NVD 응답이 아니라 러너에 만드는 로컬 H2 가 깨지는 것이었다(MVStore 예외 → NPE).
      # 2026-09-04 에 폐기하고 dependency-graph.yml 로 Gradle 트리를 GitHub 에 올리는 방식으로
      # 바꿨다. 사정은 그 파일 주석에 적어 뒀다.

  # 앱(RN/Expo)은 아직 CI 대상이 아니다 — 붙이려 했다가 되돌렸다.
  #
  # main 의 popspot-app 은 expo 스크립트(start/android/ios/web)만 있고 typecheck·test 스크립트도,
  # 검사 파일도 없다. 검사 40파일은 작업 브랜치(feat/app-design-17screens)에만 있어 아직 병합 전이다.
  # 지금 잡을 만들면 "Missing script" 로 바로 빨간불이 된다(2026-09-04 워크트리에서 실측).
  #
  # 그러니 앱 CI 는 그 브랜치가 병합되는 시점에 함께 붙인다. 그때까지 앱 <b>의존성</b>은
  # package-lock.json 을 GitHub 가 읽어 Dependabot 경보로 덮는다 — 그건 CI 잡이 없어도 된다.
